team_id: 25
mqtt:
  broker: "${MQTT_BROKER:-broker.hivemq.com}"
  port: 1883
  # 25 is the number of our group
  topics:
    - pisid_mazemov_25
    - pisid_mazetemp_25
    - pisid_mazesound_25
    - pisid_mazeact
  # Internal topics for isolation on public brokers
  internal_prefix: "pisid/25/processed"
  ack_topic: "pisid/25/persistence/ack"

mongo:
  uri: "${MONGO_URI:-mongodb://localhost:27017}"
  db: "game"

mysql:
  consulting:
    host: "${CONSULTING_DB_HOST:-consulting-db.example.edu}"
    port: 3306
    user: "${CONSULTING_DB_USER:-}"
    password: "${CONSULTING_DB_PASSWORD:-}"
    db: "${CONSULTING_DB_NAME:-maze}"
